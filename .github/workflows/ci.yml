name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      TOM_DEMO: "true"
      TOM_PROVIDER: mock
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: bash scripts/setup.sh
      - run: .venv/bin/ruff check --config backend/pyproject.toml backend scripts
      - run: .venv/bin/pytest backend/tests -q
      - run: .venv/bin/python scripts/check_scenarios.py
      - run: .venv/bin/python scripts/export_schemas.py --check
      - run: .venv/bin/python scripts/export_demo.py && git diff --exit-code -- frontend/src/demo-data.json
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
